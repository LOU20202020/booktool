# ruff 配置：只开能抓真 bug 的规则，不开风格偏好。
#
# 2026-11 实测：按 ruff 默认规则集这个仓库会报 359 条，大半是 UP/SIM/PERF 这类
# 「改写建议」—— 全开会把 CI 变成噪音，谁都不看。真正会咬人的是下面几类：
#
#   E9    语法错误（连编译都过不了）
#   F     未定义名 / 未使用的导入与变量 / f-string 缺占位符（pyflakes 那套）
#   W605  非法转义 —— Windows 路径写进普通字符串最容易犯，3.12+ 警告、将来报错
#
# 为什么需要它：拆代码时漏了 import，Qt 在 paint() 里把 NameError 吞了，
# 页面照样「能打开」，四个测试全绿，节点一个都画不出来。F821 一眼看穿。

line-length = 120
target-version = "py311"
exclude = [".venv", "build", "dist"]

[lint]
select = ["E9", "F", "W605"]
